services:
  nginx:
    image: nginx:alpine
    container_name: ic_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scr:/var/www/scr:ro

      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./nginx/health.conf:/etc/nginx/conf.d/health.conf:ro

      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  api:
    container_name: ic_api
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
